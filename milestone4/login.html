<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CliniScan AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 4rem auto;
            background: var(--panel-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 0.5rem;
        }

        .auth-container p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            background: #f8fafc;
            color: #000000;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: #0b5edd;
            background: white;
            box-shadow: 0 0 0 3px rgba(11, 94, 221, 0.1);
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: #0b5edd;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-auth:hover {
            background: #094eb8;
        }

        .auth-links {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .auth-links a {
            color: #0b5edd;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo-icon"><i class="fa-solid fa-lungs"></i></div>
            <span>CliniScan AI</span>
        </div>
        <ul class="nav-menu">
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>
    <main class="workspace">
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <p>Login to your CliniScan account</p>
            <div id="loginError" class="error-msg">Invalid email or password.</div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="doctor@hospital.org" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-auth">Login</button>
            </form>
            <div class="auth-links">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </main>
    <script src="particles.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Hardcoded fallback logic
            if (email === "admin@admin.com" && password === "admin") {
                localStorage.setItem('cliniscanCurrentUser', JSON.stringify({ name: 'Admin', email }));
                window.location.href = 'index.html';
                return;
            }

            const users = JSON.parse(localStorage.getItem('cliniscanUsers') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                localStorage.setItem('cliniscanCurrentUser', JSON.stringify(user));
                window.location.href = 'index.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });
    </script>
</body>

</html>
